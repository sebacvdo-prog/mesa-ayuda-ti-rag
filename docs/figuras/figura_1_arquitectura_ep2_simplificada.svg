<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="100.34722mm" viewBox="0 0 1440 850" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Figura 1. Arquitectura EP2 simplificada</title>
<desc id="descripcion">Arquitectura contrastada con docs/arquitectura.md y src/ep2. La CLI conecta al usuario con un agente LangChain/Groq, con planificador adaptativo y memoria SQLite EP2. Las herramientas consultan ITSM y FAISS en lectura. Una propuesta de nota requiere una decisión humana fuera del LLM. Solo una confirmación válida registra nota y auditoría en agent.db; no modifica ITSM. Las flechas representan dependencias y flujos simplificados, no llamadas adicionales al modelo.</desc>
