<path d="M1050,510 L1180,510" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flecha)"/>
<path d="M485,625 L485,720 L800,720" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flecha)"/>
<rect x="20" y="125" width="190" height="190" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="115" y="169" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">1. Consulta</text>
<text x="115" y="212" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">del usuario</text>
<text x="115" y="263" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">CLI EP2</text>
<rect x="250" y="125" width="230" height="190" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="365" y="169" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">2. Plan inicial</text>
<text x="365" y="216" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">del agente</text>
<text x="365" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Tareas previstas</text>
<rect x="520" y="125" width="260" height="190" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="650" y="159" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000">3. Consultar</text>
<text x="650" y="199" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">ticket y SLA</text>
<text x="650" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">y procedimientos</text>
<text x="650" y="282" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">ITSM RO · FAISS</text>
<rect x="820" y="125" width="260" height="190" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="950" y="159" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000">4. Cambio de</text>
<text x="950" y="199" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000">impacto</text>
<text x="950" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Reporte del usuario</text>
<text x="950" y="282" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">No verificado</text>
