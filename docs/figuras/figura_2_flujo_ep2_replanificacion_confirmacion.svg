<text x="640" y="690" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000">POSPONER</text>
<rect x="800" y="660" width="300" height="125" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="950" y="692" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">9. Conservar</text>
<text x="950" y="730" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">el estado pendiente</text>
<text x="950" y="766" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Sin nota ni auditoría</text>
<text x="485" y="765" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Sin invocar la API</text>
<text x="720" y="819" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">itsm.db permanece en solo lectura: no cambia el ticket ni su prioridad.</text>
<text x="720" y="856" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Si falla la validación, no hay nueva nota. Tras reiniciar: nueva vista previa y confirmación.</text>
</svg>
