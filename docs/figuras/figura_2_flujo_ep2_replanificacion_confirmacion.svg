<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="103.88889mm" viewBox="0 0 1440 880" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Figura 2. Flujo EP2: replanificación y confirmación humana</title>
<desc id="descripcion">Escenario simplificado basado en docs/bocetos/ep2.md, docs/arquitectura.md y src/ep2. Una consulta origina el plan y lecturas de ticket, SLA y procedimientos. Un nuevo reporte de impacto del usuario conduce a replanificar y revalidar. La nota solicitada solo se propone y pausa el ejecutor. La decisión humana se toma fuera del LLM. CONFIRMAR pasa por la API humana con permiso, huella, vigencia y revalidación del ticket; solo una validación correcta permite registrar nota y auditoría juntas en SQLite EP2 agent.db. POSPONER no invoca esa API y conserva el estado pendiente sin registrar la nota. itsm.db no se modifica. Tras reiniciar se necesita nueva vista previa y confirmación.</desc>
<defs><marker id="flecha" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#000"/></marker></defs>
<rect width="1440" height="880" fill="#fff"/>
<text x="720" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#000">Figura 2. Flujo EP2: replanificación y confirmación humana</text>
<text x="720" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Escenario: cambio de impacto reportado y propuesta de nota solicitada</text>
