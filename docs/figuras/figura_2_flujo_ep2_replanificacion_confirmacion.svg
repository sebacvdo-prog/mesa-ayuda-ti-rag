<text x="1270" y="199" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Tareas y prioridades</text>
<text x="1270" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Revalidar consultas</text>
<text x="1270" y="282" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">y dependencias</text>
<text x="720" y="347" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Continuación tras las verificaciones</text>
<rect x="20" y="445" width="300" height="170" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="170" y="478" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000">6. Preparar</text>
<text x="170" y="514" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">propuesta de nota</text>
<text x="170" y="554" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Vista previa y pausa</text>
<text x="170" y="590" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Sin registrar la nota</text>
<polygon points="485,435.0 610.0,530 485,625.0 360.0,530" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="485" y="406" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000">Fuera del LLM</text>
<text x="485" y="510" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">7. Decisión</text>
<text x="485" y="550" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">humana</text>
<text x="705" y="475" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000">CONFIRMAR</text>
<rect x="800" y="425" width="250" height="195" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="925" y="458" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000">API humana</text>
<text x="925" y="498" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Permiso, huella</text>
<text x="925" y="535" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">y vigencia</text>
<text x="925" y="573" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">Revalidar ticket</text>
<text x="925" y="605" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000">(solo lectura)</text>
<text x="1115" y="483" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000">válida</text>
<path d="M1180,439 C1180,420 1420,420 1420,439 L1420,616 C1420,635 1180,635 1180,616 Z" fill="#fff" stroke="#000" stroke-width="1.8"/>
<ellipse cx="1300.0" cy="439" rx="120.0" ry="14" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="1300" y="466" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000">8. Registrar</text>
<text x="1300" y="504" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000">nota y auditoría</text>
